spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/servers_db
    username: kairos-user
    password: kairos-password
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
  graphql:
    graphiql:
      enabled: true
    path: /graphql

server:
  port: 8081
