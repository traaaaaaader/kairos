spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/servers_db
    username: servers_user
    password: servers_password
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
  graphql:
    graphiql:
      enabled: true

server:
  port: 8081
