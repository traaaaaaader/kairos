services:
  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    restart: unless-stopped
    environment:
      TZ: Europe/Berlin
    ports:
      - "8000:8000"
      - "9443:9443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - portainer_data:/data
    networks:
      - kairos

  traefik:
    image: traefik:v3.6
    container_name: traefik
    restart: unless-stopped
    ports:
      - "80:80"
      - "8090:8080"
    labels:
      - traefik.enable=true
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=kairos"
      - "--providers.file.directory=/etc/traefik/dynamic"
      - "--providers.file.watch=true"
      - "--entrypoints.web.address=:80"
      - "--api.dashboard=true"
      - "--api.insecure=true"
      - "--log.level=DEBUG"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/dynamic:/etc/traefik/dynamic:ro
    networks:
      - kairos

  auth-db:
    image: postgres:17-alpine
    container_name: auth-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${AUTH_DB_NAME}
      POSTGRES_USER: ${AUTH_DB_USER}
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD}
    volumes:
      - auth-postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - kairos
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AUTH_DB_USER} -d ${AUTH_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  servers-db:
    image: postgres:17-alpine
    container_name: servers-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${SERVERS_DB_NAME}
      POSTGRES_USER: ${SERVERS_DB_USER}
      POSTGRES_PASSWORD: ${SERVERS_DB_PASSWORD}
    volumes:
      - servers-postgres-data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    networks:
      - kairos
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SERVERS_DB_USER} -d ${SERVERS_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  auth-service:
    build:
      context: ./kairos-auth
      dockerfile: Dockerfile
    container_name: auth-service
    restart: unless-stopped
    depends_on:
      auth-db:
        condition: service_healthy
    expose:
      - "8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://auth-db:5432/${AUTH_DB_NAME}
      SPRING_DATASOURCE_USERNAME: ${AUTH_DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${AUTH_DB_PASSWORD}
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      JWT_SECRET: ${JWT_SECRET}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.auth.rule=PathPrefix(`/auth`)"
      - "traefik.http.routers.auth.entrypoints=web"
      - "traefik.http.routers.auth.middlewares=secure-headers@file,auth-rate-limit@file,cors@file"
      - "traefik.http.services.auth.loadbalancer.server.port=8080"
    networks:
      - kairos

  servers-service:
    build:
      context: ./kairos-servers
      dockerfile: Dockerfile
    container_name: servers-service
    restart: unless-stopped
    depends_on:
      servers-db:
        condition: service_healthy
    expose:
      - "8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://servers-db:5432/${SERVERS_DB_NAME}
      SPRING_DATASOURCE_USERNAME: ${SERVERS_DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${SERVERS_DB_PASSWORD}
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.servers.rule=PathPrefix(`/servers`)"
      - "traefik.http.routers.servers.entrypoints=web"
      - "traefik.http.routers.servers.middlewares=secure-headers@file,jwt-auth@file,cors@file,servers-stripprefix"
      - "traefik.http.services.servers.loadbalancer.server.port=8081"
      - "traefik.http.middlewares.servers-stripprefix.stripprefix.prefixes=/servers"
    networks:
      - kairos

networks:
  kairos:
    driver: bridge

volumes:
  auth-postgres-data:
  servers-postgres-data:
  portainer_data:
